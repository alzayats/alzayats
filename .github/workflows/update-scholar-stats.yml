name: Update Google Scholar Stats

on:
  # Runs every Monday at 06:00 UTC (4pm AEST)
  schedule:
    - cron: "0 6 * * 1"
  # Allow manual trigger from Actions tab
  workflow_dispatch:

jobs:
  update-scholar-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Scholar stats and update README
        env:
          SCHOLAR_ID: OaFJvaIAAAAJ
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          README_PATH: README.md
        run: python scripts/update_scholar_stats.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md scholar_cache.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: update Google Scholar stats [automated]"
            git push
          fi
